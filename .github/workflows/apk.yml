name: HD Klinik Isitme Cihazi Derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android Projesini ve Yerel Ses Motorunu Olustur
        run: |
          mkdir -p android-app/app/src/main/java/com/resul/isitme
          cd android-app

          echo '
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IsitmeCihazi"
          include ":app"
          ' > settings.gradle

          gradle wrapper --gradle-version 8.5

          echo '
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          ' > gradle.properties

          echo '
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          ' > build.gradle

          echo '
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.resul.isitme"
              compileSdk 34
              defaultConfig {
                  applicationId "com.resul.isitme"
                  minSdk 26
                  targetSdk 34
                  versionCode 5
                  versionName "5.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.12.0"
              implementation "androidx.appcompat:appcompat:1.6.1"
          }
          ' > app/build.gradle

          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_btn_speak_now"
                  android:label="HD İşitme Cihazı"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeepAliveService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          ' > app/src/main/AndroidManifest.xml

          echo '
          package com.resul.isitme

          import android.content.Context
          import android.media.*
          import kotlin.math.*

          class Biquad {
              private var b0 = 1.0; private var b1 = 0.0; private var b2 = 0.0
              private var a1 = 0.0; private var a2 = 0.0
              private var x1 = 0.0; private var x2 = 0.0
              private var y1 = 0.0; private var y2 = 0.0

              fun process(x: Double): Double {
                  val y = b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2
                  x2 = x1; x1 = x; y2 = y1; y1 = y
                  return y
              }

              fun setHighPass(freq: Double, sr: Double) {
                  val w0 = 2.0 * PI * freq / sr
                  val cosw = cos(w0); val alpha = sin(w0) / 1.414
                  val a0 = 1.0 + alpha
                  b0 = ((1.0 + cosw) / 2.0) / a0
                  b1 = -(1.0 + cosw) / a0
                  b2 = ((1.0 + cosw) / 2.0) / a0
                  a1 = (-2.0 * cosw) / a0
                  a2 = (1.0 - alpha) / a0
              }

              fun setPeaking(freq: Double, sr: Double, q: Double, gainDb: Double) {
                  val a = 10.0.pow(gainDb / 40.0)
                  val w0 = 2.0 * PI * freq / sr
                  val cosw = cos(w0); val alpha = sin(w0) / (2.0 * q)
                  val a0 = 1.0 + alpha / a
                  b0 = (1.0 + alpha * a) / a0
                  b1 = (-2.0 * cosw) / a0
                  b2 = (1.0 - alpha * a) / a0
                  a1 = (-2.0 * cosw) / a0
                  a2 = (1.0 - alpha / a) / a0
              }
          }

          object AudioEngine {
              @Volatile var isRunning = false
              @Volatile var isReplaying = false
              @Volatile var currentLevel = 0
              @Volatile var gain = 3.5
              @Volatile var clarityDb = 11.0
              @Volatile var gateThresh = 0.005
              @Volatile var highPassHz = 180.0
              @Volatile var pan = 0.0
              @Volatile var micMode = 0
              @Volatile var filtersDirty = true

              private var audioThread: Thread? = null
              private const val SAMPLE_RATE = 48000
              private val ringBuffer = ShortArray(SAMPLE_RATE * 8)
              @Volatile private var ringWritePos = 0

              fun start(context: Context) {
                  if (isRunning) return
                  isRunning = true
                  isReplaying = false

                  audioThread = Thread {
                      android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_AUDIO)
                      val minIn = AudioRecord.getMinBufferSize(SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT).coerceAtLeast(1024)
                      val minOut = AudioTrack.getMinBufferSize(SAMPLE_RATE, AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT).coerceAtLeast(2048)

                      val src = if (micMode == 1) MediaRecorder.AudioSource.CAMCORDER else if (micMode == 2) MediaRecorder.AudioSource.MIC else MediaRecorder.AudioSource.VOICE_RECOGNITION
                      val recorder = AudioRecord(src, SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, minIn)

                      try {
                          val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          val builtIn = am.getDevices(AudioManager.GET_DEVICES_INPUTS).firstOrNull { it.type == AudioDeviceInfo.TYPE_BUILTIN_MIC }
                          if (builtIn != null) recorder.setPreferredDevice(builtIn)
                      } catch (_: Exception) {}

                      val player = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(SAMPLE_RATE).setChannelMask(AudioFormat.CHANNEL_OUT_STEREO).build())
                          .setBufferSizeInBytes(minOut)
                          .setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY)
                          .build()

                      val hp = Biquad(); val mud = Biquad(); val mid = Biquad(); val treb = Biquad()
                      val inBuf = ShortArray(256)
                      val outBuf = ShortArray(512)
                      var env = 0.0; var gGain = 1.0
                      var replayPos = 0; var wasReplay = false

                      recorder.startRecording()
                      player.play()

                      while (isRunning) {
                          if (filtersDirty) {
                              val sr = SAMPLE_RATE.toDouble()
                              hp.setHighPass(highPassHz, sr)
                              mud.setPeaking(320.0, sr, 1.1, -5.0)
                              mid.setPeaking(2400.0, sr, 0.9, clarityDb * 0.9)
                              treb.setPeaking(4500.0, sr, 0.85, clarityDb * 1.15)
                              filtersDirty = false
                          }

                          val read = recorder.read(inBuf, 0, inBuf.size)
                          if (read > 0) {
                              if (isReplaying && !wasReplay) { replayPos = ringWritePos; wasReplay = true }
                              else if (!isReplaying) { wasReplay = false }

                              val lG = if (pan <= 0.0) 1.0 else (1.0 - pan)
                              val rG = if (pan >= 0.0) 1.0 else (1.0 + pan)
                              var peak = 0.0

                              for (i in 0 until read) {
                                  val outS: Short
                                  if (isReplaying) {
                                      outS = ringBuffer[replayPos]
                                      replayPos = (replayPos + 1) % ringBuffer.size
                                      if (replayPos == ringWritePos) isReplaying = false
                                  } else {
                                      var x = inBuf[i] / 32768.0
                                      val ax = abs(x)
                                      env = if (ax > env) 0.93 * env + 0.07 * ax else 0.9993 * env + 0.0007 * ax
                                      val tg = if (gateThresh > 0.0 && env < gateThresh) 0.12 else if (env < 0.05) 1.35 else 1.0
                                      gGain = 0.985 * gGain + 0.015 * tg

                                      x = treb.process(mid.process(mud.process(hp.process(x))))
                                      var y = x * gGain * gain
                                      if (abs(y) > 0.65) y = tanh(y * 1.1)
                                      if (abs(y) > peak) peak = abs(y)

                                      outS = (y * 32767.0).coerceIn(-32768.0, 32767.0).toInt().toShort()
                                      ringBuffer[ringWritePos] = outS
                                      ringWritePos = (ringWritePos + 1) % ringBuffer.size
                                  }
                                  outBuf[i * 2] = (outS * lG).toInt().toShort()
                                  outBuf[i * 2 + 1] = (outS * rG).toInt().toShort()
                              }
                              currentLevel = (peak * 100.0).toInt().coerceIn(0, 100)
                              player.write(outBuf, 0, read * 2)
                          }
                      }
                      currentLevel = 0
                      try { recorder.stop(); recorder.release(); player.stop(); player.release() } catch (_: Exception) {}
                  }.apply { start() }
              }

              fun stop() {
                  isRunning = false; isReplaying = false
                  try { audioThread?.join(300) } catch (_: Exception) {}
                  audioThread = null; currentLevel = 0
              }
          }
          ' > app/src/main/java/com/resul/isitme/AudioEngine.kt

          echo '
          package com.resul.isitme

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.*
          import androidx.core.app.NotificationCompat

          class KeepAliveService : Service() {
              private var wakeLock: PowerManager.WakeLock? = null

              override fun onCreate() {
                  super.onCreate()
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Isitme::Lock").apply { acquire() }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val chId = "ha_ch"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(chId, "Isitme Servisi", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val notif = NotificationCompat.Builder(this, chId)
                      .setContentTitle("HD Klinik İşitme Cihazı Aktif")
                      .setContentText("Arka planda sıfır gecikmeyle çalışıyor")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pi).setOngoing(true).build()

                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                      else startForeground(1, notif)
                  } catch (_: Exception) {}

                  AudioEngine.start(applicationContext)
                  return START_STICKY
              }

              override fun onDestroy() {
                  AudioEngine.stop()
                  wakeLock?.let { if (it.isHeld) it.release() }
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          ' > app/src/main/java/com/resul/isitme/KeepAliveService.kt

          echo '
          package com.resul.isitme

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.view.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var btnMain: Button
              private lateinit var btnReplay: Button
              private lateinit var meterBar: ProgressBar
              private lateinit var statusTv: TextView
              private lateinit var blackoutLayer: FrameLayout
              private val uiHandler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = FrameLayout(this).apply { setBackgroundColor(Color.parseColor("#0B0D11")) }
                  val scroll = ScrollView(this)
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(45, 50, 45, 50)
                  }

                  val title = TextView(this).apply {
                      text = "HD Klinik İşitme Cihazı"
                      textSize = 22f
                      setTextColor(Color.parseColor("#00E676"))
                      gravity = Gravity.CENTER
                  }
                  val sub = TextView(this).apply {
                      text = "Sıfır Gecikme & Arka Plan Servisi"
                      textSize = 13f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 8, 0, 30)
                  }
                  card.addView(title); card.addView(sub)

                  val btnPocket = makeBtn("🌙 Cep Modu (Ekranı Karart)", "#1F242F", "#FFFFFF").apply {
                      setOnClickListener {
                          blackoutLayer.visibility = View.VISIBLE
                          Toast.makeText(this@MainActivity, "Açmak için iki kez dokunun", Toast.LENGTH_SHORT).show()
                      }
                  }
                  card.addView(btnPocket)

                  var seekGain: SeekBar? = null
                  var seekClarity: SeekBar? = null
                  var seekGate: SeekBar? = null
                  var seekBass: SeekBar? = null

                  fun setPreset(g: Int, c: Int, gt: Int, b: Int, label: String) {
                      seekGain?.progress = g; seekClarity?.progress = c; seekGate?.progress = gt; seekBass?.progress = b
                      AudioEngine.filtersDirty = true
                      statusTv.text = label + " modu seçildi"
                  }

                  val row1 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 24, 0, 10) }
                  val row2 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 0, 0, 20) }

                  val p1 = makeBtn("💎 Kristal Netlik", "#00E676", "#000000").apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { rightMargin = 12 }
                      setOnClickListener { setPreset(35, 12, 10, 180, "Kristal Netlik") }
                  }
                  val p2 = makeBtn("👥 Gürültülü Ortam", "#232834", "#FFFFFF").apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener { setPreset(30, 14, 18, 280, "Gürültülü Ortam") }
                  }
                  val p3 = makeBtn("🌿 Doğal & TV", "#232834", "#FFFFFF").apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { rightMargin = 12 }
                      setOnClickListener { setPreset(30, 6, 6, 100, "Doğal & TV") }
                  }
                  val p4 = makeBtn("👂 Uzak / Fısıltı", "#232834", "#FFFFFF").apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener { setPreset(75, 16, 8, 200, "Uzak / Fısıltı") }
                  }
                  row1.addView(p1); row1.addView(p2)
                  row2.addView(p3); row2.addView(p4)
                  card.addView(row1); card.addView(row2)

                  seekGain = addSlider(card, "Genel Ses Gücü (Amplifikatör)", 120, 35, { (it / 10.0).toString() + "x" }) {
                      AudioEngine.gain = (it.coerceAtLeast(10)) / 10.0
                  }
                  seekClarity = addSlider(card, "Konuşma & Tiz Berraklığı", 18, 12, { "+" + it.toString() + " dB" }) {
                      AudioEngine.clarityDb = it.toDouble(); AudioEngine.filtersDirty = true
                  }
                  seekGate = addSlider(card, "Sessizlikte Tıslama Kesici", 30, 10, { "Seviye " + it.toString() }) {
                      AudioEngine.gateThresh = it * 0.0005
                  }
                  seekBass = addSlider(card, "Dip Uğultu Kesme (Hz)", 350, 180, { it.coerceAtLeast(80).toString() + " Hz" }) {
                      AudioEngine.highPassHz = it.coerceAtLeast(80).toDouble(); AudioEngine.filtersDirty = true
                  }
                  addSlider(card, "Kulak Dengesi (Sol / Sağ)", 20, 10, { "Denge: " + (it - 10).toString() }) {
                      AudioEngine.pan = (it - 10) / 10.0
                  }

                  meterBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100; progress = 0; setPadding(0, 30, 0, 20)
                  }
                  card.addView(meterBar)

                  val actRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  btnMain = makeBtn("Başlat", "#00E676", "#000000").apply {
                      textSize = 18f
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.4f).apply { rightMargin = 14 }
                      setOnClickListener { toggleEngine() }
                  }
                  btnReplay = makeBtn("⏪ Son 8 Sn", "#232834", "#00E676").apply {
                      textSize = 14f
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          if (AudioEngine.isRunning) {
                              AudioEngine.isReplaying = !AudioEngine.isReplaying
                              text = if (AudioEngine.isReplaying) "🔊 Çalıyor..." else "⏪ Son 8 Sn"
                          }
                      }
                  }
                  actRow.addView(btnMain); actRow.addView(btnReplay)
                  card.addView(actRow)

                  statusTv = TextView(this).apply {
                      text = "Hazır — Başlat tuşuna dokunun"
                      textSize = 13f; setTextColor(Color.GRAY); gravity = Gravity.CENTER; setPadding(0, 24, 0, 0)
                  }
                  card.addView(statusTv)
                  scroll.addView(card)
                  root.addView(scroll)

                  blackoutLayer = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                      visibility = View.GONE
                      var lastTap = 0L
                      setOnClickListener {
                          val now = System.currentTimeMillis()
                          if (now - lastTap < 400) visibility = View.GONE
                          lastTap = now
                      }
                  }
                  root.addView(blackoutLayer, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  setContentView(root)

                  requestPerms()
                  startMeterLoop()
              }

              private fun makeBtn(txt: String, bgHex: String, fgHex: String): Button {
                  return Button(this).apply {
                      text = txt; isAllCaps = false; setTextColor(Color.parseColor(fgHex))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(bgHex))
                          cornerRadius = 28f
                      }
                  }
              }

              private fun addSlider(parent: LinearLayout, title: String, maxVal: Int, initVal: Int, fmt: (Int) -> String, onChange: (Int) -> Unit): SeekBar {
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 22, 0, 4) }
                  val lbl = TextView(this).apply { text = title; setTextColor(Color.LTGRAY); textSize = 13f; layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f) }
                  val valTv = TextView(this).apply { text = fmt(initVal); setTextColor(Color.parseColor("#00E676")); textSize = 13f }
                  row.addView(lbl); row.addView(valTv)
                  val sb = SeekBar(this).apply {
                      max = maxVal; progress = initVal
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) { valTv.text = fmt(p); onChange(p) }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  parent.addView(row); parent.addView(sb)
                  return sb
              }

              private fun toggleEngine() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPerms()
                      return
                  }
                  if (AudioEngine.isRunning) {
                      stopService(Intent(this, KeepAliveService::class.java))
                      AudioEngine.stop()
                      btnMain.text = "Başlat"
                      btnMain.background = GradientDrawable().apply { setColor(Color.parseColor("#00E676")); cornerRadius = 28f }
                      btnMain.setTextColor(Color.BLACK)
                      statusTv.text = "Durduruldu"
                  } else {
                      val intent = Intent(this, KeepAliveService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
                      AudioEngine.start(applicationContext)
                      btnMain.text = "Durdur"
                      btnMain.background = GradientDrawable().apply { setColor(Color.parseColor("#FF5252")); cornerRadius = 28f }
                      btnMain.setTextColor(Color.WHITE)
                      statusTv.text = "⚡ Aktif — Arka Planda Çalışıyor"
                  }
              }

              private fun startMeterLoop() {
                  uiHandler.postDelayed(object : Runnable {
                      override fun run() {
                          meterBar.progress = AudioEngine.currentLevel
                          if (!AudioEngine.isReplaying && btnReplay.text != "⏪ Son 8 Sn") btnReplay.text = "⏪ Son 8 Sn"
                          uiHandler.postDelayed(this, 80)
                      }
                  }, 80)
              }

              private fun requestPerms() {
                  val perms = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  val needed = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (needed.isNotEmpty()) ActivityCompat.requestPermissions(this, needed.toTypedArray(), 101)
              }
          }
          ' > app/src/main/java/com/resul/isitme/MainActivity.kt

          cd app
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: APK ve AAB Dosyalarini Kaydet ve Yayinla
        run: |
          mkdir -p output
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk HD-Isitme-Cihazi.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab HD-Isitme-Cihazi.aab

      - name: GitHub Releases olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0
          name: "HD İşitme Cihazı v5.0"
          files: |
            HD-Isitme-Cihazi.apk
            HD-Isitme-Cihazi.aab
          overwrite: true