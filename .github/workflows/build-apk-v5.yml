name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx cap add android
      - name: Native dosyaları yerleştir
        run: |
          PKG_DIR=android/app/src/main/java/com/hdklinik/isitme
          mkdir -p $PKG_DIR
          cp native/*.java $PKG_DIR/
      - name: Manifest izin ve servis ekle
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = [
            'android.permission.RECORD_AUDIO',
            'android.permission.MODIFY_AUDIO_SETTINGS',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_MICROPHONE',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
          ]
          add = ''.join('\n    <uses-permission android:name="%s" />' % x for x in perms if x not in s)
          s = s.replace('<application', add + '\n    <application', 1)
          svc = '\n        <service android:name=".ForegroundAudioService" android:foregroundServiceType="microphone" android:exported="false" />\n    </application>'
          s = s.replace('</application>', svc, 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - run: npx cap sync android
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
